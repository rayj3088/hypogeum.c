<text x="240.0" y="354.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#3c4660">warm-up from your documents</text>
<text x="680.0" y="313.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="url(#ink)" filter="url(#glow)">holomoe</text>
<text x="680.0" y="341.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#3c4660">the engine: RAM + streamed experts</text>
