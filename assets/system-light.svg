<g filter="url(#soft)"><path d="M60,44 L78,31.4 L438,31.4 L420,44 Z" fill="url(#top)" stroke="url(#iri)" stroke-width="1.2"/><path d="M420,44 L438,31.4 L438,177.4 L420,190 Z" fill="url(#side)" stroke="url(#iri)" stroke-width="1.2"/><rect x="60" y="44" width="360" height="146" fill="url(#front)" stroke="url(#iri)" stroke-width="1.6"/><rect x="60" y="44" width="360" height="146" fill="url(#fringe)"/></g>
<g filter="url(#soft)"><path d="M500,70 L518,57.4 L878,57.4 L860,70 Z" fill="url(#top)" stroke="url(#iri)" stroke-width="1.2"/><path d="M860,70 L878,57.4 L878,177.4 L860,190 Z" fill="url(#side)" stroke="url(#iri)" stroke-width="1.2"/><rect x="500" y="70" width="360" height="120" fill="url(#front)" stroke="url(#iri)" stroke-width="1.6"/><rect x="500" y="70" width="360" height="120" fill="url(#fringe)"/></g>
<g filter="url(#soft)"><path d="M60,270 L78,257.4 L438,257.4 L420,270 Z" fill="url(#top)" stroke="url(#iri)" stroke-width="1.2"/><path d="M420,270 L438,257.4 L438,377.4 L420,390 Z" fill="url(#side)" stroke="url(#iri)" stroke-width="1.2"/><rect x="60" y="270" width="360" height="120" fill="url(#front)" stroke="url(#iri)" stroke-width="1.6"/><rect x="60" y="270" width="360" height="120" fill="url(#fringe)"/></g>
<g filter="url(#soft)"><path d="M500,244 L518,231.4 L878,231.4 L860,244 Z" fill="url(#top)" stroke="url(#iri)" stroke-width="1.2"/><path d="M860,244 L878,231.4 L878,377.4 L860,390 Z" fill="url(#side)" stroke="url(#iri)" stroke-width="1.2"/><rect x="500" y="244" width="360" height="146" fill="url(#front)" stroke="url(#iri)" stroke-width="1.6"/><rect x="500" y="244" width="360" height="146" fill="url(#fringe)"/></g>
<g clip-path="url(#cl)" class="sweep"><rect x="-200" y="-20" width="160" height="470" fill="url(#sheen)" transform="skewX(-20)"><animate attributeName="x" values="-260;1100" dur="9s" repeatCount="indefinite"/></rect></g>
<text x="240.0" y="113.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="url(#ink)" filter="url(#glow)">shardpress</text>
<text x="240.0" y="141.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#3c4660">downloads the official weights</text>
<text x="680.0" y="126.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="url(#ink)" filter="url(#glow)">holopress</text>
