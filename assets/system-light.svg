<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-label="shardpress feeds holopress, holopress feeds the holomoe engine, holotrain warms the engine up">
<defs>
<linearGradient id="iri" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0">
<stop offset="0" stop-color="#00a7c4"/><stop offset=".35" stop-color="#7b4dff"/><stop offset=".7" stop-color="#e0399f"/><stop offset="1" stop-color="#d99100"/></linearGradient>
<linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0">
<stop offset="0" stop-color="#007f99"/><stop offset=".5" stop-color="#5b2fd6"/><stop offset="1" stop-color="#b8237c"/></linearGradient>
<linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#00a7c4" stop-opacity="0.1"/><stop offset="1" stop-color="#7b4dff" stop-opacity="0.03"/></linearGradient>
<linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#00a7c4" stop-opacity="0.22"/><stop offset="1" stop-color="#e0399f" stop-opacity="0.22"/></linearGradient>
<linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#e0399f" stop-opacity="0.14"/><stop offset="1" stop-color="#7b4dff" stop-opacity="0.07"/></linearGradient>
<pattern id="fringe" width="6" height="4" patternUnits="userSpaceOnUse"><rect width="6" height="1" fill="#00a7c4" opacity="0.07"/></pattern>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feComponentTransfer in="b" result="g"><feFuncA type="linear" slope="0.0"/></feComponentTransfer><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#7b4dff" flood-opacity="0.18"/></filter>
</defs>
